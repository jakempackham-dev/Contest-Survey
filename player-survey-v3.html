<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legend Reborn — Player Scan</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap');
:root {
  --bg:#07090c;--bg2:#0c1014;--bg3:#111620;--border:#1a2030;--border-hi:#243040;
  --green:#00ff88;--green-dim:#00b860;--green-lo:#002a18;
  --amber:#ffbb00;--amber-lo:#221800;--amber-dim:#c48900;
  --red:#ff3355;--red-lo:#220010;--blue:#4488ff;
  --text:#ccd8e8;--muted:#5a7090;--faint:#1e2d40;
  --mono:'Space Mono',monospace;--display:'Syne',sans-serif;--body:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;}
.screen.hidden{opacity:0;pointer-events:none;}

/* BOOT */
#bootScreen{background:var(--bg);}
.boot-content{text-align:center;width:380px;}
.game-logo{font-family:var(--display);font-size:48px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-bottom:4px;}
.game-logo span{color:var(--green);}
.game-sub{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-bottom:52px;}
.boot-bar-wrap{width:100%;height:2px;background:var(--bg3);margin-bottom:12px;border-radius:1px;}
.boot-bar{height:100%;background:var(--green);border-radius:1px;width:0;transition:width .1s linear;}
.boot-status{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;min-height:16px;}
.boot-version{font-family:var(--mono);font-size:9px;color:var(--faint);position:absolute;bottom:24px;}

/* SCAN */
#scanScreen{background:var(--bg);}
.scan-ring{width:100px;height:100px;border-radius:50%;border:2px solid var(--green-lo);border-top-color:var(--green);margin:0 auto 28px;animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.scan-title{font-family:var(--display);font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;text-align:center;}
.scan-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;min-height:18px;text-align:center;}

/* CHAT */
#chatScreen{background:var(--bg);}
.chat-layout{width:100%;height:100%;display:flex;flex-direction:column;max-width:700px;margin:0 auto;padding:0 20px;}
.chat-header{padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.chat-game-tag{font-family:var(--mono);font-size:9px;color:var(--green-dim);letter-spacing:.15em;text-transform:uppercase;}
.chat-phase{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:2px;}
.phase-bar{display:flex;gap:4px;}
.phase-pip{width:28px;height:3px;border-radius:1px;background:var(--bg3);transition:background .3s;}
.phase-pip.done{background:var(--green-dim);}
.phase-pip.active{background:var(--green);}
.chat-messages{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:2px;}
.msg{display:flex;gap:12px;max-width:88%;}
.msg.ai{align-self:flex-start;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;border:1px solid var(--border-hi);}
.msg.ai .msg-avatar{background:var(--green-lo);color:var(--green);border-color:var(--green-dim);}
.msg.user .msg-avatar{background:var(--bg3);color:var(--muted);}
.msg-bubble{padding:11px 15px;border-radius:12px;line-height:1.75;font-size:14px;}
.msg.ai .msg-bubble{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:4px 12px 12px 12px;}
.msg.user .msg-bubble{background:var(--bg3);border:1px solid var(--border-hi);color:var(--muted);border-radius:12px 4px 12px 12px;}
.msg.ai .msg-bubble strong{color:var(--green);font-weight:500;}
.msg.ai .msg-bubble em{color:var(--amber);font-style:normal;}
.typing-dots{display:flex;gap:4px;align-items:center;padding:14px 16px;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chat-input-area{padding:14px 0 22px;flex-shrink:0;}
.chat-input-wrap{display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;background:var(--bg2);border:1px solid var(--border-hi);border-radius:8px;color:var(--text);font-family:var(--body);font-size:14px;padding:12px 15px;outline:none;resize:none;line-height:1.5;max-height:160px;transition:border-color .15s;}
.chat-input:focus{border-color:var(--green-dim);}
.chat-input::placeholder{color:var(--muted);}
.chat-input:disabled{opacity:.5;}
.send-btn{width:44px;height:44px;background:var(--green-lo);border:1px solid var(--green-dim);border-radius:8px;color:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:16px;}
.send-btn:hover:not(:disabled){background:var(--green-dim);color:var(--bg);}
.send-btn:disabled{opacity:.3;cursor:not-allowed;}

/* RESULT */
#resultScreen{background:var(--bg);overflow-y:auto;align-items:flex-start;padding:32px 20px 60px;}
.result-inner{max-width:700px;margin:0 auto;width:100%;}
.result-header{text-align:center;margin-bottom:36px;}
.result-eyebrow{font-family:var(--mono);font-size:9px;color:var(--green-dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;}
.result-name{font-family:var(--display);font-size:32px;font-weight:800;color:var(--text);line-height:1.1;margin-bottom:8px;}
.result-archetype{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.06em;margin-bottom:18px;}
.result-tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
.result-tag{font-family:var(--mono);font-size:9px;padding:3px 10px;border:1px solid var(--border-hi);border-radius:2px;color:var(--muted);letter-spacing:.06em;}
.result-tag.primary{border-color:var(--green-dim);color:var(--green);}
.result-tag.flaw{border-color:var(--red-lo);color:var(--red);}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.result-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:15px 17px;}
.result-card.full{grid-column:1/-1;}
.result-card.special{border-color:var(--amber-lo);border-left:3px solid var(--amber);}
.result-card.danger{border-color:var(--red-lo);border-left:3px solid var(--red);}
.rc-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.rc-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:5px;}
.rc-body{font-size:13px;color:var(--muted);line-height:1.65;}
.rc-body strong{color:var(--text);font-weight:500;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-item{text-align:center;}
.stat-die{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green);}
.stat-name{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:2px;}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-name{color:var(--text);}
.list-note{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;max-width:55%;}
.ability-item{padding:9px 11px;background:var(--bg3);border-radius:4px;border-left:2px solid var(--border-hi);margin-bottom:8px;}
.ability-item:last-child{margin-bottom:0;}
.ability-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;}
.ability-body{font-size:12px;color:var(--muted);line-height:1.5;}
.ability-cost{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px;}
.herald-text{font-size:14px;color:var(--text);line-height:1.9;font-style:italic;white-space:pre-line;}
.result-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
.action-btn{flex:1;min-width:140px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:12px;border-radius:3px;cursor:pointer;transition:all .15s;}
.action-btn.primary{background:var(--green-lo);border:1px solid var(--green-dim);color:var(--green);}
.action-btn.primary:hover{background:var(--green-dim);color:var(--bg);}
.action-btn.ghost{background:transparent;border:1px solid var(--border-hi);color:var(--muted);}
.action-btn.ghost:hover{border-color:var(--muted);color:var(--text);}
.email-status{font-family:var(--mono);font-size:10px;margin-top:10px;min-height:16px;text-align:center;}
.email-status.ok{color:var(--green-dim);}
.email-status.err{color:var(--red);}
.glitch{animation:glitch .15s steps(1) 3;}
@keyframes glitch{0%{clip-path:inset(20% 0 60% 0);transform:translate(-3px);}25%{clip-path:inset(60% 0 10% 0);transform:translate(3px);}50%{clip-path:inset(40% 0 40% 0);transform:translate(-2px);}75%{clip-path:inset(10% 0 80% 0);transform:translate(2px);}100%{clip-path:none;transform:none;}}
@media(max-width:600px){.result-grid{grid-template-columns:1fr;}.stat-grid{grid-template-columns:repeat(2,1fr);}.result-actions{flex-direction:column;}}
</style>
</head>
<body>

<!-- BOOT -->
<div class="screen" id="bootScreen">
  <div class="boot-content">
    <div class="game-logo">Legend<span>Reborn</span></div>
    <div class="game-sub">Callista Online · American Server · v1.0</div>
    <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
    <div class="boot-status" id="bootStatus">Initializing systems...</div>
  </div>
  <div class="boot-version">CONTEST TTRPG · Character Generation Module · Session Zero</div>
</div>

<!-- SCAN -->
<div class="screen hidden" id="scanScreen">
  <div>
    <div class="scan-ring"></div>
    <div class="scan-title">Biometric scan in progress</div>
    <div class="scan-sub" id="scanSub">Preparing profile engine...</div>
  </div>
</div>

<!-- CHAT -->
<div class="screen hidden" id="chatScreen">
  <div class="chat-layout">
    <div class="chat-header">
      <div>
        <div class="chat-game-tag">Legend Reborn · Profile Engine · Callista</div>
        <div class="chat-phase" id="phaseLabel">Phase 1 — Identity Scan</div>
      </div>
      <div class="phase-bar" id="phasePips">
        <div class="phase-pip active"></div>
        <div class="phase-pip"></div>
        <div class="phase-pip"></div>
        <div class="phase-pip"></div>
        <div class="phase-pip"></div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chatInput" placeholder="Type your answer..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)" disabled></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen hidden" id="resultScreen">
  <div class="result-inner" id="resultInner"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIGURATION — REPLACE THESE FOUR VALUES
// ═══════════════════════════════════════════════
const ANTHROPIC_API_KEY   = 'YOUR_ANTHROPIC_KEY_HERE';
const EMAILJS_PUBLIC_KEY  = 'YOUR_EMAILJS_PUBLIC_KEY_HERE';
const EMAILJS_SERVICE_ID  = 'YOUR_EMAILJS_SERVICE_ID_HERE';
const EMAILJS_TEMPLATE_ID = 'YOUR_EMAILJS_TEMPLATE_ID_HERE';
// ═══════════════════════════════════════════════

emailjs.init(EMAILJS_PUBLIC_KEY);

const PHASES = [
  'Phase 1 — Identity Scan',
  'Phase 2 — Reference Pull',
  'Phase 3 — The Wound',
  'Phase 4 — Callista Placement',
  'Phase 5 — Ability Workshop',
];

let conversationHistory = [];
let currentPhase = 0;
let isTyping = false;
let characterData = null;

// ── SYSTEM PROMPT ──────────────────────────────
const SYSTEM_PROMPT = `You are the AI onboarding engine for Legend Reborn, an MMORPG set in the world of Callista. Your job is to conduct a deeply personal interview with a new player and use their answers to generate a complete, playable Contest TTRPG character that genuinely fits who they are.

You are not a chatbot. You are the game's own AI — slightly uncanny, deeply attentive, already like you know something about this person before they've said a word. Stay in this voice throughout.

━━ WORLD: CALLISTA — AMERICAN SERVER ━━

PREMISE: Legend Reborn launched this week. The Calling happened a few days ago — thousands of players arrived in Callista simultaneously. The players are among the first wave logging in. They are starting at Server Level 1, First Days era.

STARTING HUB: Concordia — Mercia's capital city. Neutral ground, all factions present, everyone passes through here eventually.

THE THREE NATIONS (American server):
- Mercia — diplomatic, structured, 25 Provinces under a Presidential system. Currently peaceful, currently bickering. Province conflict is the default tension.
- Felcho — desert, 5 warring Provinces ruled by fear under the Hancho. The Hancho has gone conspicuously quiet.
- Brandia — wild, monster-thick, 10 elected Colonies too busy fighting the land to fight each other. Monster hunters and frontier culture.

KEY LOCATIONS:
- Concordia (Mercia's capital, Tier 3 shops) — where everything starts
- Ashford (Province capital, Tier 2→3 shops) — the first active conflict zone, a border dispute nobody can trace to an actual grievance
- Ridgeport (coastal trade province, Tier 2) — best-informed Province Boss in Mercia, everything passes through her harbor
- Ashkeep (Felcho's largest city, seat of the Hancho) — the Hancho Kharim Vesh has gone quiet; rival warlords are moving
- Duneshear (warring Felcho province capital) — warlord power vacuum in progress
- Stagfall (Brandia colony, Tier 2→3) — monster-hunting traffic, Trophy Wardens based here
- Ironvale (Brandia mining colony, Tier 1→2) — frontier, desperate, grateful for any Reborn willing to help

THE SIX GUILDS (American server — players can affiliate or go independent):
- The Concord Compact — Story Vanguard. Here for the big narrative beats, chapter by chapter, ideally first. Commander: Priya Osei (Support). HQ: Concordia.
- The Province Line Militia — Warband. Territory, rivalry, PvP over the story line. Commander: Captain Rutger Vane (Tank). HQ: mobile, currently Ashford.
- The Trophy Wardens — Raid Syndicate. Dungeons, hunts, hardest content. Commander: Gunnar Fell (Melee). HQ: Stagfall.
- The Completionist Lodge — ladders, achievements, reputation grinds, 100% clear rates.
- The Lore Circle — mysteries, old texts, the weird stuff nobody's explained yet.
- We Definitely Read The Patch Notes — Chaos/Social. Fun, mayhem, the MMO launch energy. Commander: "Chaos" Mo Delgado (Specialist).

THE EMBER COURT (Callista's pantheon — nine seated gods):
- Solraith, the Dawnbringer — order, law, kingship
- Ashka, the Devouring Sand — hunger, ambition, trial by hardship
- Ymbral, the Wild Warden — beasts, wilderness, the primal hunt
- Corvenna, the Veiled Lady — fate, secrets, death and rebirth (coined "the Reborn" as a name for players)
- Thessaly, the Tideborn — sea, travel, storms
- Kaidor, the Iron Word — honor, steel, oaths
- Nyxa, the Hollow Star — shadow, hidden knowledge, dreams
- Umbeth, the Rootmother — growth, ancestry, the green world
- Vael, the Still Flame — balance, the seat whose doctrine is that none of the other eight dominate
- (Old doctrine says there were always meant to be ten seats. Nobody has ever seen the tenth filled.)

CHANNELING SOURCES AVAILABLE:
Elemental binding, combat data inscription, divine signal (Architect-tuned or Ember Court patron), shadow threading (Nyxa-adjacent), beast-bond (Ymbral), runic engineering, blood-covenant (Kaidor oaths), dream-weaving (Nyxa/Corvenna)

ACT 1 — FAULT LINES: "THE QUIET PROVINCES"
Chapter 1 — Border Static (Mercia, Ashford & Concordia): Province Bosses having shared dreams, fueling a border dispute nobody started.
Chapter 2 — The Hancho's Silence (Felcho): Kharim Vesh gone missing, rival warlords Sable Ren and Ossian Drask moving on the opening.
Chapter 3 — What Brandia Remembers (Brandia): Wildlife moving with unnatural coordination. Old Yarrow, hermit tracker in Ironvale, notices it first.
Chapter 4 — The Static Choir, Revealed (Concordia): All three threads trace back to a cult recruiting off the same dream-static. Boss: High Choir-Speaker Nadia Kessler.

SURFACE THREAT (what players are told): Dark forces rising across Callista, destabilizing the provincial balance. Chapter Bosses emerging. Push the Server Level and find the source before it reaches Concordia.

━━ CONTEST TTRPG RULES ━━

ROLES (choose one — determines Blessing and one Ability):
- Tank: Blessing +1 HP max
- Melee: Blessing +1 Physical Feat
- Ranged: Blessing +2 Attack vs unseen/unaware targets
- Caster: Blessing +1 Magical Feat
- Support: Blessing — gift 1 TEN to ally as a reaction once per scene
- Specialist: Blessing +1 Feat of any category

ARCHETYPES (pick the most fitting for this specific player):
Vanguard, Skirmisher, Warden, Duelist, Sentinel, Tactician, Slayer, Wildcard, Engineer, Priest, Brawler, Artisan, Shadow, Charlatan, Enchanter, Diplomat, Occultist, Infiltrator, Beastmaster, Gambler, Investigator, Revenant, Warrior, Commander, Champion, Dancer, Breaker, Zealot, Survivor, Scholar, Trickster, Pathfinder

STATS — assign d20/d12/d10/d8/d6/d4 (highest die = best stat):
- STR — melee attack, physical force, breaking things
- SPD — melee attack, dodging, initiative
- STA — defending, endurance, resisting damage
- SKL — ranged attack, precision, technical work
- SAG — channeling, wisdom, perception
- SWY — channeling, charisma, persuasion

FEATS:
Physical: Athletic, Hearty, Crack Shot, Escape Artist, Ambidextrous, Heavy Hitter, Quickdraw, Opportunist, Fleet-Footed, Speedy Defender, Weapon Master, Iron Grip, Unique Fighting Style, Deceptive Fighting, Cornered Instinct, Surprising, Marked Target
Mental: Silver-Tongued, Cool-Headed, Inspiring, Eagle Eye, Willpower, Discerning, Interrogator, Manipulator, Teamwork, Whisperer, Sapper, Prediction, Hardened by Failure, Battle Orator
Magical: Elemental Aptitude, Duelist Channeler, Storage Unit, Widespread, Unshakable, Ritualist, Enchanter, Targeted, Volley, Resistant, Rune Master, Twin Casting, Steady Empower

FLAWS (one — revealed through interview, not asked directly):
Physical: Sickly, Injured, Clumsy, Glass Jaw, Heavy-Handed, Old Injury, Slow, Near-Sighted, Marked Target, Fragile Grip
Mental: Ambitious, Gambler, Apathetic, Hothead, Traumatized, A Bit Mad, Savant, Phobia, Forgetful, Paranoid, Gullible, Glory Hound, Doubts the Method
Magical: Cursed, Tainted, Chaotic, Blowback, Supercharge, Magic Leak, Vessel-Bound, Open Book

EQUIPMENT:
Weapons — Light (Dur 1, Dmg 1), Medium (Dur 2, Dmg 2), Heavy (Dur 3, Dmg 3). Types: Piercing / Slashing / Bludgeoning.
Armor — Light (Dur 2, +1 Def, +1 SPD), Medium (Dur 3, +2 Def, -1 SPD, -1 Channel), Heavy (Dur 4, +3 Def, -2 SPD, -2 Channel), Shield (Dur 2, +1 Def, no heavy weapon).
Give each character 1 weapon + 1 armor + 1 signature item that ties to their personality or backstory.

CHANNELING (if applicable — Caster or Specialist primarily, others if it fits):
Source: where the power comes from
Vessel: what it moves through (fixed 2 Dur, cannot Defend while active)
Control: how it's directed (spoken word / ritual / pure will / gesture / faith)

ABILITIES — 3 total:
1. Role Ability — tied to their Role's Blessing theme
2. Archetype Ability — tied to their Archetype's identity
3. Item Ability — tied to their signature equipment piece
Each has: Name, Effect type (Impact/Affliction/Fortify/Warp), Charges (per Scene or per Day), Cost (Free with gate condition, or TEN cost)

SPECIAL MOVE:
Shape options: Focused (3 dmg single target), Sweeping (2 dmg all in range), Compound (2 dmg + status effect), Fading (+2 atk/def to all allies, decays each round)
Cost: 6 TEN or 2 HP. 1x per Scene. Auto-succeeds. Last Stand: free at 0 HP, cannot restore own HP.
Name it something worth shouting.

━━ INTERVIEW INSTRUCTIONS ━━

You are conducting a 5-phase interview. Each exchange should feel like the game is genuinely listening — not checking boxes. React to what they actually say. Reference their specific words in follow-up questions. Never ask more than one question at a time.

PHASE 1 — Identity Scan (2-3 exchanges):
Open with atmosphere. You are the game's AI, conducting a scan. Ask their name first — frame it as the system initializing their player profile. Then probe who they actually are: physical presence, instincts under pressure, what they're genuinely good at that most people don't notice. Stay in the Legend Reborn fiction — this is a biometric and psychographic scan.

PHASE 2 — Reference Pull (2-3 exchanges):
Ask what characters from any medium — anime, games, books, film, anything — resonate with them and specifically WHY. Push past surface answers. If they say a character's name, ask what part of that character they recognize in themselves. Use these references to triangulate Role and Archetype. Also probe which of the six play styles (Story Vanguard, Warband, Raid Syndicate, Completionist, Lore Circle, Chaos/Social) pulls them — but frame it as what they want out of their first days in Callista, not as a category selection.

PHASE 3 — The Wound (1-2 exchanges):
Reveal the Flaw through conversation, not a direct question. Ask something open-ended about what gets in their way, what pattern keeps showing up when things go wrong, what they've carried longer than they should. Frame it within the fiction: the game needs to understand your vulnerabilities to build your resistances. Never use the word "flaw." Receive their answer with recognition — not analysis. Let the silence sit.

PHASE 4 — Callista Placement (1-2 exchanges):
Connect them to the world using everything you know about them now. Suggest a starting nation (Mercia / Felcho / Brandia), a guild affiliation or independent status, and a patron god from the Ember Court that fits their character. Ask if it lands — let them adjust. If they Channel, define their trinity here. Frame it as the world recognizing them, not as a player choice.

PHASE 5 — Ability Workshop (2-3 exchanges):
Propose their three Abilities and Special Move by name. For each Ability, give: the name, what it looks like when used at the table, and the mechanical basics. For the Special Move, give the name and a one-line flavor description of what it looks like when they finally let it go. Ask if the Special Move name and description feel right — this is the one thing they get to workshop. When it feels locked, end the session.

COMPLETION: When Phase 5 is complete and the player has confirmed their Special Move, output exactly: GENERATION_COMPLETE
Then immediately output the character JSON with no other text before it.

CHARACTER JSON FORMAT:
{
  "playerName": "",
  "characterName": "their chosen name or a generated one if they haven't named themselves",
  "archetypeTitle": "The [evocative adjective] [noun] of [Callista location or faction]",
  "role": "",
  "archetype": "",
  "startingNation": "Mercia / Felcho / Brandia",
  "guildAffiliation": "guild name or Independent",
  "emberCourtPatron": "deity name or None",

// ── BOOT SEQUENCE ──────────────────────────────
const bootMsgs = [
  'Initializing systems...','Loading Callista server data...','Connecting to American server...',
  'Calibrating biometric scanner...','Player profile engine ready.','Welcome to the First Days.',
];

window.onload = function() {
  let i=0,pct=0;
  const bar=document.getElementById('bootBar'),status=document.getElementById('bootStatus');
  const iv=setInterval(()=>{
    pct+=3;bar.style.width=Math.min(pct,100)+'%';
    if(i<bootMsgs.length&&pct>=(i+1)*16)status.textContent=bootMsgs[i++];
    if(pct>=100){clearInterval(iv);setTimeout(()=>{fadeOut('bootScreen');fadeIn('scanScreen');beginScan();},600);}
  },55);
};

function fadeOut(id){const el=document.getElementById(id);el.style.opacity='0';setTimeout(()=>el.classList.add('hidden'),500);}
function fadeIn(id){const el=document.getElementById(id);el.classList.remove('hidden');el.style.opacity='0';requestAnimationFrame(()=>{el.style.opacity='1';});}

// ── SCAN SEQUENCE ──────────────────────────────
const scanMsgs=['Reading biometric signature...','Cross-referencing player profile...','Analyzing psychographic markers...','Loading Callista world context...','Initializing adaptive interview engine...','First Days detected. Server Level 1.','Profile generation ready.'];
function beginScan(){
  let i=0;const sub=document.getElementById('scanSub');
  const iv=setInterval(()=>{
    if(i<scanMsgs.length)sub.textContent=scanMsgs[i++];
    else{clearInterval(iv);setTimeout(()=>{fadeOut('scanScreen');fadeIn('chatScreen');startChat();},700);}
  },520);
}

// ── CLAUDE API ─────────────────────────────────
async function callClaude(messages){
  const res=await fetch('https://contest-server-production-36c0.up.railway.app/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system:SYSTEM_PROMPT,messages})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API error '+res.status);}
  const data=await res.json();return data.content[0].text;
}

// ── CHAT ───────────────────────────────────────
function startChat(){
  conversationHistory=[];currentPhase=0;updatePhaseUI();
  sendAIOpening();
}

async function sendAIOpening(){
  showTyping();
  const opener={role:'user',content:'Begin Phase 1. Open with a short atmospheric welcome that establishes you as the game\'s AI conducting a biometric scan. Reference that the player is among the first wave in Callista — the First Days, Server Level 1. Then ask for their name. 3-4 sentences maximum. Be slightly uncanny — like you already know something about them before they\'ve spoken.'};
  conversationHistory.push(opener);
  try{
    const r=await callClaude(conversationHistory);
    conversationHistory.push({role:'assistant',content:r});
    hideTyping();addMessage('ai',r);enableInput();
  }catch(e){hideTyping();addMessage('ai','Connection error: '+e.message+'. Please refresh and try again.');}
}

async function sendMessage(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text||isTyping)return;
  input.value='';input.style.height='auto';
  disableInput();addMessage('user',text);
  conversationHistory.push({role:'user',content:text});
  detectPhase();showTyping();
  try{
    const r=await callClaude(conversationHistory);
    conversationHistory.push({role:'assistant',content:r});
    hideTyping();
    if(r.includes('GENERATION_COMPLETE')){
      const beforeTag=r.split('GENERATION_COMPLETE')[0].trim();
      if(beforeTag)addMessage('ai',beforeTag);
      setTimeout(()=>parseAndShowResult(r),1200);
    }else{addMessage('ai',r);enableInput();}
  }catch(e){hideTyping();addMessage('ai','Something went wrong: '+e.message);enableInput();}
}

function detectPhase(){
  const userCount=conversationHistory.filter(m=>m.role==='user').length;
  if(userCount>=3&&currentPhase<1){currentPhase=1;updatePhaseUI();}
  else if(userCount>=5&&currentPhase<2){currentPhase=2;updatePhaseUI();}
  else if(userCount>=7&&currentPhase<3){currentPhase=3;updatePhaseUI();}
  else if(userCount>=9&&currentPhase<4){currentPhase=4;updatePhaseUI();}
}

function updatePhaseUI(){
  document.getElementById('phaseLabel').textContent=PHASES[currentPhase]||PHASES[4];
  document.querySelectorAll('.phase-pip').forEach((p,i)=>{
    p.classList.remove('active','done');
    if(i<currentPhase)p.classList.add('done');
    else if(i===currentPhase)p.classList.add('active');
  });
}

function addMessage(role,text){
  const msgs=document.getElementById('chatMessages');
  const ti=document.getElementById('typingIndicator');if(ti)ti.remove();
  const div=document.createElement('div');div.className=`msg ${role}`;
  const av=document.createElement('div');av.className='msg-avatar';av.textContent=role==='ai'?'LR':'YOU';
  const bub=document.createElement('div');bub.className='msg-bubble';
  bub.innerHTML=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
  div.appendChild(av);div.appendChild(bub);msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  isTyping=true;const msgs=document.getElementById('chatMessages');
  if(document.getElementById('typingIndicator'))return;
  const div=document.createElement('div');div.className='msg ai';div.id='typingIndicator';
  const av=document.createElement('div');av.className='msg-avatar';av.textContent='LR';
  const bub=document.createElement('div');bub.className='msg-bubble';
  bub.innerHTML='<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  div.appendChild(av);div.appendChild(bub);msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){isTyping=false;const el=document.getElementById('typingIndicator');if(el)el.remove();}
function enableInput(){document.getElementById('chatInput').disabled=false;document.getElementById('sendBtn').disabled=false;document.getElementById('chatInput').focus();}
function disableInput(){document.getElementById('chatInput').disabled=true;document.getElementById('sendBtn').disabled=true;}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';}

// ── RESULT ─────────────────────────────────────
function parseAndShowResult(raw){
  let c=null;
  try{const m=raw.match(/\{[\s\S]*\}/);if(m)c=JSON.parse(m[0]);}catch(e){console.error(e);}
  characterData=c;
  fadeOut('chatScreen');
  setTimeout(()=>{fadeIn('resultScreen');c?renderResult(c):renderFallback(raw);},600);
}

function renderResult(c){
  const el=document.getElementById('resultInner');

  const statsHtml=Object.entries(c.stats||{}).map(([s,d])=>`<div class="stat-item"><div class="stat-die">${d}</div><div class="stat-name">${s}</div></div>`).join('');
  const equipHtml=(c.equipment||[]).map(e=>`<div class="list-item"><span class="list-name">${e.name}</span><span class="list-note">${e.type||''} ${e.weight||''} · ${e.notes||''}</span></div>`).join('');
  const featsHtml=(c.feats||[]).map(f=>`<div class="list-item"><span class="list-name">${f.name}</span><span class="list-note">${f.description||''}</span></div>`).join('');
  const abilitiesHtml=(c.abilities||[]).map(a=>`<div class="ability-item"><div class="ability-name">${a.name}</div><div class="ability-body">${a.description}</div><div class="ability-cost">${a.origin} · ${a.charges||''} · Cost: ${a.cost||''}</div></div>`).join('');

  const channelingHtml=c.channeling?.source?`
    <div class="result-card">
      <div class="rc-label">Channeling Trinity</div>
      <div class="rc-body"><strong>Source:</strong> ${c.channeling.source}<br><strong>Vessel:</strong> ${c.channeling.vessel} (${c.channeling.vesselDur||2} Dur)<br><strong>Control:</strong> ${c.channeling.control}</div>
    </div>`:'';

  const worldHtml=`
    <div class="result-card">
      <div class="rc-label">Callista Placement</div>
      <div class="rc-body">
        <strong>Nation:</strong> ${c.startingNation||'—'}<br>
        <strong>Guild:</strong> ${c.guildAffiliation||'Independent'}<br>
        <strong>Patron:</strong> ${c.emberCourtPatron||'None'}
      </div>
    </div>`;

  el.innerHTML=`
    <div class="result-header">
      <div class="result-eyebrow">// Character generation complete · First Days · Server Level 1</div>
      <div class="result-name" id="charNameDisplay">${c.archetypeTitle||c.characterName||'Your Character'}</div>
      <div class="result-archetype">${c.role||''} · ${c.archetype||''}</div>
      <div class="result-tags">
        <span class="result-tag primary">${c.role||''}</span>
        <span class="result-tag primary">${c.archetype||''}</span>
        <span class="result-tag">${c.startingNation||''}</span>
        <span class="result-tag">${c.guildAffiliation||'Independent'}</span>
        <span class="result-tag flaw">${c.flaw?.name||''}</span>
      </div>
    </div>

    <div class="result-grid">
      <div class="result-card full">
        <div class="rc-label">The Herald Speaks</div>
        <div class="herald-text">${c.herald||'Herald text not generated.'}</div>
      </div>

      <div class="result-card">
        <div class="rc-label">Stats</div>
        <div class="stat-grid">${statsHtml}</div>
      </div>

      ${worldHtml}

      <div class="result-card full">
        <div class="rc-label">Equipment</div>
        ${equipHtml}
      </div>

      <div class="result-card full">
        <div class="rc-label">Feats</div>
        ${featsHtml}
      </div>

      <div class="result-card full danger">
        <div class="rc-label">Flaw — ${c.flaw?.name||''}</div>
        <div class="rc-body" style="font-style:italic;margin-bottom:8px">${c.flaw?.description||''}</div>
        <div class="rc-body">${c.flaw?.howItPlays||''}</div>
      </div>

      ${channelingHtml}

      <div class="result-card full">
        <div class="rc-label">Abilities</div>
        ${abilitiesHtml}
      </div>

      <div class="result-card full special">
        <div class="rc-label">Special Move</div>
        <div class="rc-title">${c.specialMove?.name||'Unnamed'}</div>
        <div class="rc-body" style="font-style:italic;margin-bottom:8px">"${c.specialMove?.flavorText||''}"</div>
        <div class="rc-body"><strong>Shape:</strong> ${c.specialMove?.shape||''} · <strong>Cost:</strong> 6 TEN or 2 HP · Auto-succeeds · 1×/Scene<br>${c.specialMove?.description||''}</div>
      </div>

      <div class="result-card"><div class="rc-label">Lead out on</div><div class="rc-body">${c.playabilityInsights?.leadOut||'—'}</div></div>
      <div class="result-card"><div class="rc-label">You show an aptitude for</div><div class="rc-body">${c.playabilityInsights?.aptitude||'—'}</div></div>
      <div class="result-card"><div class="rc-label">Beware</div><div class="rc-body">${c.playabilityInsights?.beware||'—'}</div></div>
      <div class="result-card"><div class="rc-label">At the table</div><div class="rc-body">${c.playabilityInsights?.atTheTable||'—'}</div></div>
    </div>

    <div class="result-actions">
      <button class="action-btn primary" onclick="window.print()">Save as PDF</button>
      <button class="action-btn ghost" onclick="location.reload()">New Character</button>
    </div>
    <div class="email-status" id="emailStatus"></div>
  `;

  setTimeout(()=>{
    const n=document.getElementById('charNameDisplay');
    if(n)n.classList.add('glitch');
  },400);

  // Auto-send GM email
  sendGMEmail(c);
}

// ── EMAIL ──────────────────────────────────────
async function sendGMEmail(c){
  const statusEl=document.getElementById('emailStatus');
  if(!c)return;

  const statsText=Object.entries(c.stats||{}).map(([s,d])=>`${s}: ${d}`).join(' · ');
  const featsText=(c.feats||[]).map(f=>`${f.name} — ${f.description}`).join('\n');
  const equipText=(c.equipment||[]).map(e=>`${e.name} (${e.type||''} ${e.weight||''}, Dur ${e.dur||'?'}) — ${e.notes||''}`).join('\n');
  const channelingText=c.channeling?.source?`Source: ${c.channeling.source}\nVessel: ${c.channeling.vessel} (${c.channeling.vesselDur||2} Dur)\nControl: ${c.channeling.control}`:'None';
  const abilitiesText=(c.abilities||[]).map(a=>`${a.name} [${a.origin}]\n${a.description}\n${a.charges||''} · Cost: ${a.cost||''}`).join('\n\n');
  const specialMoveText=`${c.specialMove?.name||''} (${c.specialMove?.shape||''})\n"${c.specialMove?.flavorText||''}"\n${c.specialMove?.description||''}\nCost: 6 TEN or 2 HP · Auto-succeeds · 1×/Scene`;

  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      player_name:      c.playerName||'Unknown',
      archetype_title:  c.archetypeTitle||'',
      role:             c.role||'',
      archetype:        c.archetype||'',
      starting_nation:  c.startingNation||'',
      guild:            c.guildAffiliation||'Independent',
      patron:           c.emberCourtPatron||'None',
      stats:            statsText,
      feats:            featsText,
      flaw_name:        c.flaw?.name||'',
      flaw_description: c.flaw?.description||'',
      flaw_how_it_plays:c.flaw?.howItPlays||'',
      equipment:        equipText,
      channeling:       channelingText,
      abilities:        abilitiesText,
      special_move_name:c.specialMove?.name||'',
      special_move:     specialMoveText,
      lead_out:         c.playabilityInsights?.leadOut||'',
      aptitude:         c.playabilityInsights?.aptitude||'',
      beware:           c.playabilityInsights?.beware||'',
      at_the_table:     c.playabilityInsights?.atTheTable||'',
      herald:           c.herald||'',
      gm_brief:         c.gmBrief||'',
    });
    if(statusEl)statusEl.textContent='✓ GM brief sent.';
    if(statusEl)statusEl.className='email-status ok';
  }catch(e){
    console.error('Email error:',e);
    if(statusEl)statusEl.textContent='Email send failed — screenshot this page and send to your GM.';
    if(statusEl)statusEl.className='email-status err';
  }
}

function renderFallback(raw){
  document.getElementById('resultInner').innerHTML=`
    <div class="result-header"><div class="result-eyebrow">// Character generated</div><div class="result-name" style="font-size:20px">Your Character</div></div>
    <div class="result-card full"><div class="rc-label">Raw Output</div><div class="rc-body" style="white-space:pre-wrap;font-size:12px">${raw}</div></div>
    <div class="result-actions"><button class="action-btn ghost" onclick="location.reload()">Start over</button></div>`;
}
